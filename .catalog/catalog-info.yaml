apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: tektoncd-tools-cosign
  title: Tektoncd Tools - Cosign
  description: Cosign 是 Sigstore 项目提供的容器镜像签名与验签工具，用于保障供应链安全。在 Tekton 流水线中作为镜像签名任务镜像的核心依赖。
  tags:
    - security
    - supply-chain
    - signing
    - open-source-fork
  links:
    - url: https://github.com/AlaudaDevops/cosign
      title: GitHub Repository
      icon: github
    - url: https://build-sonar.alauda.cn/dashboard?id=github.com-AlaudaDevops-cosign
      title: SonarQube
      icon: dashboard
    - url: https://github.com/sigstore/cosign
      title: Upstream Repository
      icon: github
  annotations:
    # github plugin
    github.com/project-slug: AlaudaDevops/cosign
    # sonarqube plugin
    sonarqube.org/project-key: github.com-AlaudaDevops-cosign
    # 开源组件代码仓库地址，格式：${url}/${project}/${repo}
    acp.cpaas.io/open-source-component-repo: https://github.com/sigstore/cosign
    # 开源组件的版本信息，只适用于开源组件，自研组件默认不收集版本信息,格式 ${version}
    acp.cpaas.io/open-source-component-version: v2.6.3
    # 开源组件的license信息,格式 ${license}
    acp.cpaas.io/open-source-component-license: Apache
    # 开源组件的license地址,格式 ${url}/${project}/${repo}/${license-path}
    acp.cpaas.io/open-source-component-license_url: https://github.com/sigstore/cosign/blob/main/LICENSE
    # backstage techdocs plugin
    backstage.io/techdocs-ref: dir:../
    acp.cpaas.io/owner: qingliu@alauda.io

    # 组件属性，区别是否部署时必带的核心组件,可选值为 core 和 plugin。
    acp.cpaas.io/functional-attributes: plugin

spec:
  type: service
  system: system:alauda-devops-system
  lifecycle: production
  owner: devops
